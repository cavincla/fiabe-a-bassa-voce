services:
  app:
    build:
      context: .
      dockerfile: .build/dockerfiles/Dockerfile
      target: build
    ports:
      - "3000:3000"
    volumes:
      - "./app:/app:cached"
      - "app_node_modules:/app/node_modules"
      - "./.data/bob-s-home:/home/bob:cached"
    environment:
      - TERM=xterm-256color
      - TZ=Europe/Rome
      - DATABASE_URL=postgresql://fiabe:fiabe_dev_password@db:5432/fiabe
    depends_on:
      - db

  db:
    image: postgres:16
    ports:
      - "5433:5432"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    environment:
      - TZ=Europe/Rome
      - POSTGRES_DB=fiabe
      - POSTGRES_USER=fiabe
      - POSTGRES_PASSWORD=fiabe_dev_password

volumes:
  # node_modules lives in a named volume, not the bind mount above: native
  # deps (Prisma engines, ...) built inside the Linux container would
  # otherwise get shadowed/broken by a host node_modules of a different OS.
  app_node_modules:
  pgdata:
