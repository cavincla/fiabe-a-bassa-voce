services:
  app:
    build:
      context: .
      dockerfile: .build/dockerfiles/Dockerfile
      target: build
    ports:
      - "3000:3000"
    volumes:
      - "./app:/app:cached"
      - "app_node_modules:/app/node_modules"
      - "./.data/bob-s-home:/home/bob:cached"
    environment:
      - TERM=xterm-256color
      - TZ=Europe/Rome

volumes:
  # node_modules lives in a named volume, not the bind mount above: a host
  # node_modules built on a different OS would otherwise shadow the one
  # installed inside the Linux container.
  app_node_modules:
