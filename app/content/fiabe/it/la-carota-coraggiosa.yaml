# La carota coraggiosa — 3-5 anni
# Lo slug della fiaba è il nome di questo file; l'ordine delle pagine è
# l'ordine in cui appaiono qui sotto.
titolo: La carota coraggiosa
descrizione: >-
  Cico non ha mai voluto assaggiare le verdure, finché una sera non incontra
  Carotina, che gli racconta perché vale la pena essere coraggiosi anche a
  tavola.
eta:
  da: 3
  a: 5
temi: [coraggio]
salute: [alimentazione]
# Direzione artistica della fiaba: la scena viene composta a strati
# (cielo, bagliore, colline, alberi, personaggio) da questi colori, e la
# luce si abbassa da sola pagina dopo pagina.
scena:
  cielo: ["#F6BE6E", "#DE7B3F"]
  colline: ["#A85A16", "#6B3A10"]
  luce: "#FFE6BB"
  sagoma: carota
  notte: false
pagine:
  - testo: >-
      Cico guardava il piatto con sospetto. C'era di nuovo quella cosa arancione
      e croccante che sua mamma chiamava carota.
  - testo: >-
      «Non la voglio» disse Cico, incrociando le braccia. Ma la carota, con sua
      grande sorpresa, gli strizzò l'occhio.
  - testo: >-
      «Mi chiamo Carotina» disse la verdura «e so che fa paura provare cose
      nuove. Ma un piccolo morso è un piccolo atto di coraggio.»
  - testo: >-
      Cico ci pensò su, poi ne prese un pezzettino. Croccante, dolce,
      buonissima! Da quella sera, ogni verdura nuova divenne una piccola
      avventura.
