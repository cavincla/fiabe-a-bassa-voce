# La bambina che parlava con la luna — 4-6 anni
# Lo slug della fiaba è il nome di questo file; l'ordine delle pagine è
# l'ordine in cui appaiono qui sotto.
titolo: La bambina che parlava con la luna
descrizione: >-
  Ogni sera Vera non riesce a prendere sonno, finché non scopre di poter
  raccontare le sue giornate alla luna dalla finestra. Un piccolo rito che
  rende la notte meno grande.
eta:
  da: 4
  a: 6
temi: [gentilezza]
salute: [sonno]
# Direzione artistica della fiaba: la scena viene composta a strati
# (cielo, bagliore, colline, alberi, personaggio) da questi colori, e la
# luce si abbassa da sola pagina dopo pagina.
scena:
  cielo: ["#2D2861", "#110E2A"]
  colline: ["#1E1A42", "#0A0819"]
  luce: "#F6E8C0"
  sagoma: bambina
  notte: true
  lunaGrande: true
pagine:
  - testo: >-
      Vera restava sveglia nel suo letto ogni sera, con la testa piena di
      pensieri che giravano come trottole: la scuola, i litigi, le cose non
      dette durante il giorno.
  - testo: >-
      Una notte, guardando fuori dalla finestra, vide la luna tonda e silenziosa
      sopra i tetti. «Ciao» le sussurrò piano, tanto per provare. La luna non
      rispose, ma sembrò ascoltare.
  - testo: >-
      Da quella sera, Vera cominciò a raccontarle tutto: la caduta in cortile,
      la torta buona, l'amica che le mancava. Parola dopo parola, i pensieri si
      facevano più leggeri.
  - testo: >-
      «Grazie per avermi ascoltata» diceva sempre, alla fine, prima di tirare su
      le coperte. La luna restava lì, paziente, come fa da sempre con chiunque
      alzi lo sguardo.
  - testo: >-
      Vera scoprì che raccontare la giornata a qualcuno, anche solo a una luna
      silenziosa, era il modo più dolce per lasciarla andare e finalmente
      addormentarsi.
