# Il piccolo orso e la torta di miele — 3-5 anni
# Lo slug della fiaba è il nome di questo file; l'ordine delle pagine è
# l'ordine in cui appaiono qui sotto.
titolo: Il piccolo orso e la torta di miele
descrizione: >-
  Bruno l'orsetto ha preparato una torta di miele solo per sé, ma davanti
  alla porta trova tre amici affamati. Scopre che una torta condivisa sa
  ancora più buona.
eta:
  da: 3
  a: 5
temi: [condivisione]
salute: [alimentazione]
# Direzione artistica della fiaba: la scena viene composta a strati
# (cielo, bagliore, colline, alberi, personaggio) da questi colori, e la
# luce si abbassa da sola pagina dopo pagina.
scena:
  cielo: ["#F7D289", "#C98A2E"]
  colline: ["#A8701F", "#6C4711"]
  luce: "#FFF3CD"
  sagoma: orso
  notte: false
pagine:
  - testo: >-
      Bruno l'orsetto aveva impastato per tutto il pomeriggio: farina, miele
      dorato e un pizzico di cannella. La torta uscì dal forno profumata e
      perfetta, tutta per lui.
  - testo: >-
      Stava per tagliarsene una grande fetta quando bussarono alla porta: il
      tasso Tobia, lo scoiattolo Nino e la piccola lepre Mora, con la pancia che
      brontolava.
  - testo: >-
      «Che buon profumo!» disse Tobia, guardando la torta con occhi grandi.
      Bruno strinse il piatto al petto. «È mia» pensò, ma non riuscì a dirlo ad
      alta voce.
  - testo: >-
      Guardò i suoi amici, poi la torta, poi di nuovo i suoi amici. Prese il
      coltello e cominciò a tagliare quattro fette, una per ciascuno, l'ultima
      più piccola per sé.
  - testo: >-
      Seduti tutti insieme sul prato, la torta sparì in pochi minuti tra risate
      e briciole di miele sui musi. Bruno pensò che non l'aveva mai sentita così
      buona.
