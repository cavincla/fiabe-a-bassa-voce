# Il drago che aveva paura di volare — 5-8 anni
# Lo slug della fiaba è il nome di questo file; l'ordine delle pagine è
# l'ordine in cui appaiono qui sotto.
titolo: Il drago che aveva paura di volare
descrizione: >-
  Ignazio è un draghetto con ali enormi che non ha mai osato aprire. Un
  salto dalla cima della montagna gli insegna che il coraggio, a volte, è
  solo un primo battito d'ali.
eta:
  da: 5
  a: 8
temi: [coraggio]
salute: []
# Direzione artistica della fiaba: la scena viene composta a strati
# (cielo, bagliore, colline, alberi, personaggio) da questi colori, e la
# luce si abbassa da sola pagina dopo pagina.
scena:
  cielo: ["#DC6E52", "#7A2D2D"]
  colline: ["#5C2020", "#321212"]
  luce: "#FFD2A0"
  sagoma: drago
  notte: false
pagine:
  - testo: >-
      Ignazio era un draghetto rosso con ali enormi, più grandi di quelle di
      ogni altro drago della montagna. Eppure non le aveva mai aperte davvero,
      nemmeno una volta.
  - testo: >-
      «E se cadessi?» pensava, guardando gli altri draghetti volteggiare nel
      cielo sopra le nuvole. Restava sempre sul bordo della roccia, con le ali
      strette al corpo.
  - testo: >-
      Un vecchio drago con la barba di fumo si sedette accanto a lui. «Le ali
      non servono a non cadere» disse. «Servono a decidere dove andare, mentre
      cadi.»
  - testo: >-
      Ignazio chiuse gli occhi, respirò forte, e si lasciò cadere dal bordo
      della roccia. Per un istante lunghissimo ci fu solo vento, e nient'altro
      sotto di lui.
  - testo: >-
      Poi le sue ali si aprirono da sole, enormi e dorate nel sole del tramonto,
      e Ignazio smise di cadere e cominciò, finalmente, a volare.
