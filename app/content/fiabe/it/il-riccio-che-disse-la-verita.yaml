# Il riccio che disse la verità — 5-7 anni
# Lo slug della fiaba è il nome di questo file; l'ordine delle pagine è
# l'ordine in cui appaiono qui sotto.
titolo: Il riccio che disse la verità
descrizione: >-
  Pino il riccio ha rotto per sbaglio il fischietto di legno del nonno.
  Nascondere l'accaduto sembra la via più facile, finché non scopre che dire
  la verità pesa molto meno.
eta:
  da: 5
  a: 7
temi: [onestà]
salute: []
# Direzione artistica della fiaba: la scena viene composta a strati
# (cielo, bagliore, colline, alberi, personaggio) da questi colori, e la
# luce si abbassa da sola pagina dopo pagina.
scena:
  cielo: ["#D0A075", "#8A5A3F"]
  colline: ["#6B4530", "#462C1E"]
  luce: "#FFDCA6"
  sagoma: riccio
  notte: false
pagine:
  - testo: >-
      Pino stava giocando a palla in salotto, anche se sapeva di non doverlo
      fare. La palla rimbalzò contro la mensola e il fischietto di legno del
      nonno cadde, spaccandosi in due.
  - testo: >-
      Il cuore di Pino batteva forte. Prese i due pezzi e li nascose in fondo al
      cassetto, sotto le calze. «Nessuno se ne accorgerà» si disse, ma non ci
      credeva davvero.
  - testo: >-
      Per tutta la sera, ogni volta che il nonno gli sorrideva, Pino sentiva un
      peso strano nello stomaco, come un sasso ingoiato per sbaglio.
  - testo: >-
      Prima di andare a dormire, Pino tornò in salotto con i due pezzi in mano.
      «Nonno, ho rotto il tuo fischietto giocando dove non dovevo. Mi dispiace
      tanto.»
  - testo: >-
      Il nonno lo guardò a lungo, poi sorrise piano. «Un fischietto si aggiusta
      con la colla. La verità di un nipote, quella non si aggiusta se si rompe.»
      Il sasso nello stomaco di Pino sparì.
